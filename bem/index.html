<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="page-header__inner">
      <a class="page-header__logo" href="#top" aria-label="Profile トップページ">
        <img class="page-header__logo-image" src="img/logo.svg" alt="Profile">
      </a>
      <nav class="page-header__nav" aria-label="メインナビゲーション">
        <ul class="page-header__nav-list">
          <li class="page-header__nav-item"><a class="page-header__nav-link" href="#about">About</a></li>
          <li class="page-header__nav-item"><a class="page-header__nav-link" href="#bicycle">Bicycle</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-label="メインビジュアル">
      <img class="hero__image" src="img/mainvisual.jpg" alt="自転車に乗る人">
    </section>

    <section id="about" class="section section--about">
      <div class="section__inner">
        <h2 class="section__title">About</h2>
        <div class="profile">
          <img class="profile__image" src="img/about.jpg" alt="KAKERUのプロフィール写真">
          <div class="profile__body">
            <h3 class="profile__name">KAKERU</h3>
            <p class="profile__description">テキストテキストテキストテキストテキストテキストテキストテキスト<br>テキストテキストテキストテキストテキストテキストテキストテキスト<br>テキストテキストテキストテキストテキストテキストテキストテキスト</p>
          </div>
        </div>
      </div>
    </section>

    <section id="bicycle" class="section section--bicycle">
      <div class="section__inner">
        <h2 class="section__title">Bicycle</h2>
        <div class="bicycle-list">
          <article class="bicycle-card">
            <img class="bicycle-card__image" src="img/bicycle1.jpg" alt="自転車の写真 1">
            <div class="bicycle-card__body">
              <h3 class="bicycle-card__title">タイトルタイトル</h3>
              <p class="bicycle-card__description">テキストテキストテキストテキストテキストテキストテキスト</p>
            </div>
          </article>
          <article class="bicycle-card">
            <img class="bicycle-card__image" src="img/bicycle2.jpg" alt="自転車の写真 2">
            <div class="bicycle-card__body">
              <h3 class="bicycle-card__title">タイトルタイトル</h3>
              <p class="bicycle-card__description">テキストテキストテキストテキストテキストテキストテキスト</p>
            </div>
          </article>
          <article class="bicycle-card">
            <img class="bicycle-card__image" src="img/bicycle3.jpg" alt="自転車の写真 3">
            <div class="bicycle-card__body">
              <h3 class="bicycle-card__title">タイトルタイトル</h3>
              <p class="bicycle-card__description">テキストテキストテキストテキストテキストテキストテキスト</p>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <div class="page-footer__inner">
      <p class="page-footer__copyright">&copy; 2026 Profile</p>
    </div>
  </footer>
</body>
</html>
